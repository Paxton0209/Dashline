<!DOCTYPE html>
<html lang="en">
<head>
<script>try{const s=JSON.parse(localStorage.getItem('dsi4')||'{}'),k=s.scheme||(s.darkMode===true?'dark':null);document.documentElement.dataset.theme=k||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashline</title>
<meta name="description" content="Dashline is a rule-based cockpit icon system for automotive HMI, including navigation, media, vehicle controls, and climate.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ds-radius-thumb:4px; --ds-radius-control:10px; --ds-radius-panel:14px; --ds-radius-surface:18px;
  --side:#f7f7f7; --bg:#f7f7f7; --panel:#ffffff; --stage:#f3f3f3; --ink:#1d1d1f; --t2:rgba(29,29,31,.74); --t3:rgba(29,29,31,.6); --t4:rgba(29,29,31,.28);
  --icon:#1d1d1f; --hair:rgba(0,0,0,.075); --lift:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.06); --fill:rgba(29,29,31,.05); --fill2:rgba(29,29,31,.08); --sel:rgba(29,29,31,.06);
  --pill:#fff; --pill-sh:0 1px 2px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.04);
  --accent:#007aff; --key:rgba(0,122,255,.5); --grid:rgba(0,122,255,.1);
  --gbg:var(--stage); --gl:rgba(29,29,31,.055); --gk:rgba(29,29,31,.2); --gs:rgba(29,29,31,.42); --gf:rgba(29,29,31,.025);
  --success:#1f9d3a; --warning:#b86e00; --danger:#c62828; --favorite:#f19000;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --out:cubic-bezier(.22,1,.36,1);
  --cell:80px; --sz:40px; --insp:380px;
  --t-title:600 24px/1.2 var(--display); --t-body:400 14px/20px var(--font); --t-cap:400 12px/16px var(--font);
  --weather-sun:#9E620D; --weather-rain:#276CA5; --weather-snow:#45689D; --weather-fog:#556D88;
  color-scheme:light;
}
:root[data-theme=dark] body{background:var(--bg)}
:root[data-theme=dark]{
  --side:#1a1b1d; --bg:#18191b; --panel:#222326; --stage:#2a2b2e; --ink:#f5f5f7; --t2:rgba(245,245,247,.74); --t3:rgba(245,245,247,.56); --t4:rgba(245,245,247,.26);
  --icon:#f5f5f7; --hair:rgba(255,255,255,.08); --lift:0 0 0 1px rgba(255,255,255,.08); --fill:rgba(255,255,255,.05); --fill2:rgba(255,255,255,.09); --sel:rgba(255,255,255,.07);
  --pill:rgba(255,255,255,.12); --pill-sh:none;
  --accent:#0a84ff; --key:rgba(10,132,255,.65); --grid:rgba(10,132,255,.14);
  --gbg:var(--stage); --gl:rgba(245,245,247,.05); --gk:rgba(245,245,247,.18); --gs:rgba(245,245,247,.4); --gf:rgba(245,245,247,.025);
  --success:#32d74b; --warning:#ffb340; --danger:#ff6b60; --favorite:#ffa31a;
  --weather-sun:#FFBE56; --weather-rain:#80C4FA; --weather-snow:#BCD4FF; --weather-fog:#9DB4CA;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:var(--t-body);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background-color .4s,color .4s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit;border:0;outline:0;background:none}
svg.ic{display:block;overflow:visible}
.app{display:grid;grid-template:"side main" minmax(0,1fr) "credit main" auto / 260px minmax(0,1fr);height:100vh}

/* ---------- sidebar ---------- */
.credit{grid-area:credit;display:flex;column-gap:6px;align-items:baseline;padding:12px 24px 16px;background:transparent;font:var(--t-cap);color:var(--t3)}
.credit a{color:inherit;text-decoration:none;transition:color .2s}
.credit a:hover,.credit a:focus-visible{color:var(--ink);text-decoration:underline}
.side{grid-area:side;display:flex;flex-direction:column;padding:32px 12px 16px;background:transparent;min-height:0;overflow:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.brand{padding:10px 12px 0;font:var(--t-body);font-weight:500;height:32px}
.find{display:flex;align-items:center;gap:8px;flex:0 1 280px;min-width:0;max-width:280px;height:40px;margin:0;padding:0 10px 0 12px;border:1px solid var(--hair);border-radius:var(--ds-radius-control);background:transparent;box-shadow:none;transition:border-color .16s,box-shadow .16s}
.find:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
.find svg{width:20px;height:20px;color:var(--t3);flex:none}
.find input{flex:1;min-width:0;font:var(--t-body)}
.find input::placeholder{color:var(--t3)}
.find kbd{font:var(--t-cap);color:var(--t3);padding:0 7px;border-radius:var(--ds-radius-thumb);background:var(--fill)}
.find.has kbd{display:none}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.navind{position:absolute;left:0;right:0;top:0;height:38px;border-radius:var(--ds-radius-control);background:var(--panel);box-shadow:var(--lift);z-index:0;pointer-events:none}
.navind[data-slide]{transition:transform .24s var(--out)}
@media(prefers-reduced-motion:reduce){.navind[data-slide]{transition:none}}
.it{position:relative;z-index:1;display:flex;align-items:center;height:38px;padding:0 12px;border-radius:var(--ds-radius-control);color:var(--t2);text-align:left;font:var(--t-body);transition:background-color .2s,color .2s}
.it:hover{color:var(--ink)}
.it span{flex:1}
.it em{font:var(--t-cap);font-style:normal;color:var(--t3);font-variant-numeric:tabular-nums}
.it.on{color:var(--ink);font-weight:500}
.it.on em{color:var(--t2)}
.subs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--out)}
.subs > div{overflow:hidden}
.it.on + .subs{grid-template-rows:1fr}
.subs button{position:relative;display:flex;align-items:center;width:100%;height:34px;padding:0 12px 0 24px;font:var(--t-body);color:var(--t3);border-radius:var(--ds-radius-control);text-align:left;transition:color .2s}
.subs button:hover{color:var(--ink)}
.subs button.on{color:var(--ink)}
.subs button::before{content:"";position:absolute;left:13px;top:50%;width:1px;height:34px;margin-top:-17px;background:var(--hair)}
.subs button.on::before{background:var(--ink)}
.subs button em{margin-left:auto;font:var(--t-cap);font-style:normal;color:var(--t4)}
.subs > div{padding:0;transition:padding .3s var(--out)}
.it.on + .subs > div{padding:4px 0 8px}
.side > *{flex-shrink:0}
.foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px;font:var(--t-body);color:var(--t2)}
.seg{position:relative;display:flex;padding:2px;border-radius:var(--ds-radius-control);background:var(--fill)}
.seg button{position:relative;z-index:1;width:36px;height:28px;border-radius:var(--ds-radius-thumb);display:grid;place-items:center;color:var(--t3);transition:color .2s;font:var(--t-cap)}
.seg button.on{color:var(--ink)}
.seg button svg{width:18px;height:18px}
.seg .ind{position:absolute;top:2px;left:2px;width:36px;height:28px;border-radius:var(--ds-radius-thumb);background:var(--pill);box-shadow:var(--pill-sh);transition:transform .3s cubic-bezier(.3,1.25,.5,1)}
.meta{padding:8px 12px 0;font:var(--t-cap);color:var(--t3)}

/* ---------- content ---------- */
/* Keep the panel's rounded surface separate from the scroll area's clip. */
.main{grid-area:main;margin:12px 12px 12px 0;border-radius:var(--ds-radius-control);background:var(--panel);box-shadow:var(--lift);display:flex;flex-direction:column;min-height:0;min-width:0;transition:background-color .4s,border-radius .3s}

.mhead{flex:none;display:flex;align-items:center;gap:12px;height:76px;padding:0 20px 0 36px;border-bottom:1px solid transparent;transition:border-color .2s}
.mhead.sc{border-bottom-color:var(--hair)}
.mhead h1{font:var(--t-title)}
.mhead > span{font:var(--t-title);font-weight:400;color:var(--t4);font-variant-numeric:tabular-nums}
.mhead .sp{flex:1}
.cap{display:flex;align-items:center;height:44px;padding:0 6px;border-radius:var(--ds-radius-panel);background:var(--panel);box-shadow:0 0 0 1px var(--hair),0 2px 10px rgba(0,0,0,.04);gap:2px}
.cap > i{width:1px;height:20px;background:var(--hair);margin:0 4px}
.sz{display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;height:36px;color:var(--t3)}
.sz svg.s{width:14px;height:14px}.sz svg.l{width:22px;height:22px}
.sz output{font:var(--t-cap);color:var(--ink);width:22px;text-align:right;font-variant-numeric:tabular-nums}
.cb{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 10px;border-radius:var(--ds-radius-control);font:var(--t-body);color:var(--t2);transition:background-color .2s,color .2s,transform .2s}
.cb:hover{background:var(--fill);color:var(--ink)}
.cb:active{transform:scale(.96)}
.cb svg{width:20px;height:20px}
.cb.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cb .tw{position:relative;width:20px;height:20px}
.cb .tw svg{position:absolute;inset:0;transition:transform .45s cubic-bezier(.34,1.4,.64,1),opacity .25s}
:root[data-theme=dark] .cb .sun,:root:not([data-theme=dark]) .cb .moon{opacity:0;transform:rotate(-70deg) scale(.6)}
.tools{display:flex;align-items:center;gap:4px}
.tools .seg{margin-right:8px}
.tb{position:relative;width:36px;height:36px;border-radius:var(--ds-radius-control);display:grid;place-items:center;color:var(--t2);transition:background-color .2s,color .2s,transform .2s}
.tb:hover{background:var(--fill);color:var(--ink)}
.tb:active{transform:scale(.92)}
.tb svg{width:22px;height:22px}
.tb.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tb.theme svg{position:absolute;transition:transform .45s cubic-bezier(.34,1.4,.64,1),opacity .25s}
:root[data-theme=dark] .tb.theme .sun,:root:not([data-theme=dark]) .tb.theme .moon{opacity:0;transform:rotate(-70deg) scale(.6)}
.scroll{flex:1;overflow:auto;padding:8px 24px 80px;scroll-padding-block:40px;mask-image:linear-gradient(to bottom,transparent,#000 var(--library-fade-top,0px),#000 calc(100% - var(--library-fade-bottom,0px)),transparent)}
.view{position:relative}
.pane{position:absolute;left:0;right:0;top:0;content-visibility:hidden;pointer-events:none}
.pane.on{position:relative;content-visibility:visible;pointer-events:auto;will-change:opacity,transform}
.pane.out{content-visibility:visible;will-change:opacity}
.view.out{opacity:0;transform:translateY(6px)}
.grp{display:grid;grid-template-columns:168px 1fr;padding:16px 0;border-top:1px solid var(--hair)}
.grp:first-child{border-top:0;padding-top:8px}
.gh{padding-top:calc((var(--cell) - 20px) / 2)}
.gh b{display:block;font:var(--t-body);font-weight:500}
.gh small{display:block;margin-top:2px;font:var(--t-cap);color:var(--t3)}
.tiles{content-visibility:auto;contain-intrinsic-size:auto 200px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell),1fr));gap:2px}
.t{position:relative;width:100%;height:var(--cell);border-radius:var(--ds-radius-control);display:grid;place-items:center;color:var(--icon);outline:0;transition:background-color .2s ease}
.t:hover{background:var(--fill)}
.t:active,.t.sel{background:var(--fill2)}
/* Inset ring: tile containers use content-visibility (paint containment) and neighbours sit 2px away, so an outer ring gets clipped. */
.t:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.t .ic{position:absolute;inset:0;margin:auto;width:var(--sz);height:var(--sz)}
.enter{animation:tin .4s var(--out) both;animation-delay:calc(var(--i) * 6ms)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.none{padding:120px 0;text-align:center;color:var(--t3);font:var(--t-body)}
.sug{margin-top:18px;display:flex;gap:6px;justify-content:center;align-items:center;font:var(--t-body);color:var(--t3)}
.sug button{height:32px;padding:0 14px;border-radius:var(--ds-radius-control);background:var(--fill);color:var(--ink);transition:background-color .2s}
.sug button:hover{background:var(--fill2)}
.none b{display:block;font:var(--t-title);color:var(--ink);margin-bottom:6px}


/* DriveScene Studio appearance control and root reveal. */
@property --theme-reveal-progress{syntax:"<length>";inherits:false;initial-value:0px}
@property --vr{syntax:"<length>";inherits:false;initial-value:0px}
.ghost.reveal-new{-webkit-mask-image:radial-gradient(circle at var(--vx) var(--vy),#000 calc(var(--vr) - var(--vf)),transparent var(--vr));mask-image:radial-gradient(circle at var(--vx) var(--vy),#000 calc(var(--vr) - var(--vf)),transparent var(--vr))}
.ghost.reveal-old-soft{-webkit-mask-image:radial-gradient(circle at var(--vx) var(--vy),transparent calc(var(--vr) - var(--vf)),#000 var(--vr));mask-image:radial-gradient(circle at var(--vx) var(--vy),transparent calc(var(--vr) - var(--vf)),#000 var(--vr))}
/* The old drawing fades out 1px inside the new layer's fully opaque core, so no pixel is half-covered by both (no white seam). */
.ghost.reveal-old{-webkit-mask-image:radial-gradient(circle at var(--vx) var(--vy),transparent calc(var(--vr) - var(--vf) - 1.5px),#000 calc(var(--vr) - var(--vf) - .5px));mask-image:radial-gradient(circle at var(--vx) var(--vy),transparent calc(var(--vr) - var(--vf) - 1.5px),#000 calc(var(--vr) - var(--vf) - .5px))}
::view-transition-group(root),::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition{pointer-events:none}
.theme-changing,.theme-changing *{transition:none!important}
@media (prefers-reduced-motion:no-preference){
.theme-changing::view-transition-old(root){z-index:1}
.theme-changing::view-transition-new(root){z-index:2;mask-image:radial-gradient(circle at var(--theme-reveal-x) var(--theme-reveal-y),#fff calc(var(--theme-reveal-progress) - 160px),transparent var(--theme-reveal-progress));animation:theme-reveal 400ms cubic-bezier(.65,0,.35,1) both}
@keyframes theme-reveal{from{--theme-reveal-progress:0px;opacity:.5}to{--theme-reveal-progress:var(--theme-reveal-radius);opacity:1}}
}

/* The surface and controls share motion; artwork retains its source trajectory. */
@property --dialog-surface-opacity{syntax:"<number>";inherits:true;initial-value:1}
@property --dialog-copy-opacity{syntax:"<number>";inherits:true;initial-value:1}
.veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.15);opacity:0;pointer-events:none}
:root[data-theme=dark] .veil{background:rgba(0,0,0,.55)}
body.modal .veil{opacity:1;pointer-events:auto;touch-action:none}
.sheet{position:fixed;z-index:42;left:50%;top:calc(50% - 24px);width:min(880px,calc(100vw - 48px));height:min(600px,calc(100dvh - 96px));transform:translate(-50%,-50%);transform-origin:top left;display:none;grid-template-columns:minmax(0,1fr) minmax(285px,36%);outline:none;isolation:isolate;border-radius:var(--ds-radius-panel);will-change:transform,filter}
.sheet::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--panel);border-radius:inherit;box-shadow:0 16px 52px rgba(0,0,0,.12);opacity:var(--dialog-surface-opacity)}
.sheet .sr,.sheet .keys{opacity:var(--dialog-surface-opacity)}
.sheet .acts2{opacity:var(--dialog-copy-opacity)}
.sheet[data-closing]{pointer-events:none}
body.modal .sheet{display:grid}
.sl{position:relative;display:grid;place-items:center;min-width:0;pointer-events:none}
.stage{position:relative;width:min(76%,352px,max(120px,calc(100dvh - 256px)));aspect-ratio:1;color:var(--icon)}
.stage .keys,.stage #big{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stage:empty{visibility:hidden}
.stage .keys{pointer-events:none;mask-image:radial-gradient(closest-side,#000 73%,transparent 120%)}
.keys line,.keys .icon-grid-keylines{transform-box:fill-box;transform-origin:center}
.keys.draw line,.keys.draw .icon-grid-keylines{animation:grid-reveal .24s cubic-bezier(.32,.72,0,1) both}
.keys.draw .v{animation-name:grid-reveal-v}
.keys.draw .icon-grid-keylines{animation-name:grid-reveal-guides}
@keyframes grid-reveal{from{opacity:0;scale:0 1}}
@keyframes grid-reveal-v{from{opacity:0;scale:1 0}}
@keyframes grid-reveal-guides{from{opacity:0;scale:.92}}
.sr{min-height:0;padding:8px 28px 28px;display:flex;flex-direction:column;overflow:auto;overscroll-behavior:contain;scrollbar-width:none}
.sr::-webkit-scrollbar{display:none}
.sr .iph{padding:0;margin-right:-10px;height:56px}
.sr .acts2{margin-top:auto;padding-top:20px;flex:none}
.ihead{margin-top:16px}
.sfade{animation:sfade .18s ease-out both}
@keyframes sfade{from{opacity:0}to{opacity:1}}
.acts2{display:flex;align-items:center}
.acts2 .bt.pri{flex:1}
.t.sel .ic{visibility:hidden}
.t.sel{background:transparent}
@media (max-width:620px){
  .sheet{top:auto;bottom:0;left:0;transform:none;width:100%;height:min(92dvh,590px);grid-template-columns:1fr;grid-template-rows:minmax(135px,1fr) minmax(172px,1fr);border-radius:var(--ds-radius-surface) var(--ds-radius-surface) 0 0;background:var(--panel);overflow:hidden}
  .stage{width:min(48vw,190px,max(110px,calc(44dvh - 68px)))}
  .sr{padding:0 22px 20px}
  .sr .iph{height:42px}
  .ihead{margin-top:2px}
}

/* ---------- inspector ---------- */
.insp{min-width:0;overflow:hidden}
.ip{width:var(--insp);height:100vh;display:flex;flex-direction:column;padding:8px 8px 8px 0}
.ipin{flex:1;display:flex;flex-direction:column;border-radius:var(--ds-radius-panel);background:var(--panel);box-shadow:0 0 0 1px var(--hair);overflow:auto;scrollbar-width:none;transition:background-color .4s}
.ipin::-webkit-scrollbar{display:none}
.iph{display:flex;align-items:center;gap:2px;height:60px;padding:0 12px 0 22px;flex:none}
.iph .crumb{flex:1;font:var(--t-cap);color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{width:36px;height:36px;border-radius:var(--ds-radius-control);display:grid;place-items:center;color:var(--icon);transition:background-color .2s,transform .2s}
.rb:hover{background:var(--fill)}
.rb:active{transform:scale(.92)}
.rb svg{width:22px;height:22px}
#close{width:40px;height:40px;border-radius:var(--ds-radius-control);background:var(--fill);margin-right:-6px}#close:hover{background:var(--fill2)}#close svg{width:22px;height:22px}
.ib{padding:0 22px 24px;opacity:0;transform:translateX(12px);transition:opacity .2s ease,transform .3s var(--out)}
body.insp .ib{opacity:1;transform:none;transition-delay:.06s}
.stage-old{}
.icon-grid-fine,.icon-grid-keylines{fill:none;stroke-width:1}
.icon-grid-fine{stroke:var(--gs)}
.icon-grid-keylines{stroke:var(--gk)}
.gbtn{position:absolute;right:12px;bottom:12px;height:30px;padding:0 12px;border-radius:var(--ds-radius-control);font:var(--t-cap);color:var(--t2);background:var(--panel);box-shadow:var(--pill-sh),0 0 0 1px var(--hair);transition:color .2s}
.gbtn.on{color:var(--accent)}
.iname{margin-top:22px;font:var(--t-title)}
.ipath{margin-top:10px;font:var(--t-cap);color:var(--t3);display:flex;gap:12px;flex-wrap:wrap}
.ipath .r{color:var(--accent)}
.sec{margin-top:24px}
.sec h4{font:var(--t-cap);color:var(--t3);margin-bottom:10px}
.part-links{padding-bottom:24px}
.part-links nav+h4{margin-top:14px}
.part-links nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.part-links button{display:grid;place-items:center;aspect-ratio:1;border-radius:var(--ds-radius-control);background:var(--fill);color:var(--icon)}
.part-links button:hover{background:var(--fill2)}
.part-links button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.part-links button .ic{width:30px;height:30px}
.sizes{position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:16px 14px 12px;border-radius:var(--ds-radius-panel);background:var(--stage);transition:background-color .4s}
.sizes button{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--icon);opacity:.45;transition:opacity .2s}
.sizes button:hover{opacity:.8}
.sizes button.on{opacity:1}
.sizes small{font:var(--t-cap);color:var(--t2);font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:var(--ds-radius-thumb)}

  .scroll{padding:8px 16px 40px}
  .social-links{margin:4px 16px 8px}

/* ---- Layout trial: search heads the sidebar column; no toolbar row in the panel ---- */
.app,body.xray .app{grid-template:"find main" auto "side main" minmax(0,1fr) "credit main" auto / 260px minmax(0,1fr)}
.app>.find{grid-area:find;align-self:start;width:auto;max-width:none;margin:12px 12px 0;background:transparent}
.side{padding:12px 12px 12px}
.mhead[hidden]{display:none}
.scroll{padding:24px 24px 80px}
/* Labels sit above their icons, so the grid gets the full width. */
:root{--cell:72px}
.grp{grid-template-columns:minmax(0,1fr);padding:28px 0 0;border-top:0}
.grp:first-child{padding-top:0}
.gh{padding:0 0 6px}
.gh b{font:500 13px/20px var(--font);color:var(--t2)}
.gh small{display:inline;margin-left:8px}
.gh b,.gh small{display:inline}
/* Appearance belongs to the page, not to navigation: it sits in the panel's top-right corner. */
/* Group labels stick to the top of the panel; the appearance button lives at the right end of that row. */
.scroll{padding-top:0;mask-image:linear-gradient(to bottom,#000 calc(100% - var(--library-fade-bottom,0px)),transparent)}
.gh{position:sticky;top:0;z-index:2;display:flex;align-items:center;height:56px;padding:0;margin-bottom:-6px;background:var(--panel);transition:background-color .4s}
.grp{padding-top:16px}
.grp:first-child{padding-top:0}
/* Search is a field: recessed, so it never reads like the raised selected category. */
.app>.find{height:36px;border-color:transparent;background:var(--fill)}
.app>.find:focus-within{background:var(--fill);border-color:var(--accent)}
.app>.find kbd{background:var(--fill2)}
/* Search and categories are different things: their gap matches the panel inset, well beyond the 2px between categories. */
.side{padding-top:24px}
/* Dialog: outline / filled switch under the name, only for symbols that have both. */
.ihead{display:flex;align-items:center;gap:12px;min-height:52px}
.ihead{padding-top:18px}
.ihead .iname{flex:1;min-width:0;margin-top:0}
/* Same title row height and top in both pages, so the relation list never shifts on entry or return. */
.sheet.trail .ihead{margin-top:0}
@media(max-width:620px),(max-height:520px){.ihead{margin-top:28px}.sheet.trail .ihead{margin-top:0}}
.vseg{position:relative;flex:none;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px;border-radius:var(--ds-radius-control);background:var(--fill)}
.vseg[hidden]{display:none}
.vseg button{position:relative;z-index:1;width:42px;height:32px;padding:0;display:grid;place-items:center;border-radius:8px;color:var(--t3);transition:color .16s}
.vseg button>svg{display:block}
.vseg button:hover{color:var(--ink)}
.vseg button[aria-checked=true]{color:var(--ink)}
.vseg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.vseg .ind{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:8px;background:var(--pill);box-shadow:var(--pill-sh);transition:transform .24s var(--out)}
.vseg[data-v=solid] .ind{transform:translateX(100%)}
@media(prefers-reduced-motion:reduce){.vseg .ind{transition:none}}
@media(max-width:900px){
  .app,body.xray .app{grid-template:"find" auto "side" auto "main" minmax(0,1fr) "credit" auto / minmax(0,1fr)}
  .app>.find{margin:8px 8px 0}
  .gh{height:48px}
  .side{padding:8px 8px 0}
  .social-links{margin:4px 16px 8px}
  .scroll{padding:0 16px 40px}
  :root{--cell:64px}
}

// Timing, checkmark and synthesized tap come from the portfolio’s contact copy feedback.
const COPY_TIMING={out:100,in:120,labelDelay:40,tickDelay:80,tick:180,hold:1000,returnOut:100,returnIn:180};
const copyButton=$('#cSvg');
const copyIdle=copyButton.querySelector('.svg-copy-idle');
const copyResult=copyButton.querySelector('.svg-copy-result');
const copyTick=copyResult.querySelector('path');
const copyLabel=copyResult.querySelector('span');
const copyStatus=$('#svg-copy-status');
const copyReducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let copyAudio,copyNoiseBuffer,copyRequest,copyTickAnimation;
let copyTimers=[],copyAnimations=[];

function prepareCopyAudio(){
  try{
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio)return;
    copyAudio??=new Audio();
    if(copyAudio.state==='suspended')copyAudio.resume().catch(()=>{});
  }catch(_){}
}
function playCopyTap(){
  try{
    const audio=copyAudio;
    if(!audio||audio.state!=='running')return;
    if(!copyNoiseBuffer){
      copyNoiseBuffer=audio.createBuffer(1,Math.ceil(audio.sampleRate*.03),audio.sampleRate);
      const samples=copyNoiseBuffer.getChannelData(0);
      for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;
    }
    const t=audio.currentTime;
    const noise=audio.createBufferSource(),filter=audio.createBiquadFilter(),noiseGain=audio.createGain();
    noise.buffer=copyNoiseBuffer;filter.type='bandpass';filter.frequency.value=3200;filter.Q.value=2.5;
    noiseGain.gain.setValueAtTime(0,t);noiseGain.gain.linearRampToValueAtTime(.22,t+.001);noiseGain.gain.exponentialRampToValueAtTime(.0001,t+.03);
    noise.connect(filter).connect(noiseGain).connect(audio.destination);noise.start(t);noise.stop(t+.03);
    const tone=audio.createOscillator(),toneGain=audio.createGain();
    tone.type='sine';tone.frequency.setValueAtTime(180,t);tone.frequency.exponentialRampToValueAtTime(90,t+.03);
    toneGain.gain.setValueAtTime(0,t);toneGain.gain.linearRampToValueAtTime(.08,t+.001);toneGain.gain.exponentialRampToValueAtTime(.0001,t+.03);
    tone.connect(toneGain).connect(audio.destination);tone.start(t);tone.stop(t+.03);
    noise.onended=()=>{noise.disconnect();filter.disconnect();noiseGain.disconnect()};
    tone.onended=()=>{tone.disconnect();toneGain.disconnect()};
  }catch(_){}
}
function clearCopyAnimations(){
  copyAnimations.forEach(animation=>animation.cancel());
  copyAnimations=[];
  copyTickAnimation=null;
}
function clearCopyFeedback(){
  copyTimers.forEach(clearTimeout);
  copyTimers=[];
  clearCopyAnimations();
  delete copyButton.dataset.copyState;
  copyStatus.textContent='';
}
function freezeCopyForClose(){
  copyRequest=null;
  copyTimers.forEach(clearTimeout);copyTimers=[];
  const style=getComputedStyle(copyButton);
  const opacity=style.opacity,transform=style.transform;
  copyButton.style.transition='none';
  copyButton.style.opacity=opacity;copyButton.style.transform=transform;
}
function resetSvgCopy(){
  for(const key of ['transition','opacity','transform'])copyButton.style.removeProperty(key);
  copyRequest=null;
  clearCopyFeedback();
}
function fadeCopyLabel(element,from,to,duration,delay=0,easing='ease'){
  const animation=element.animate([{opacity:from},{opacity:to}],{duration,delay,fill:'both',easing});
  copyAnimations.push(animation);
  return animation;
}
function showCopyFeedback(copied){
  const replay=Boolean(copyButton.dataset.copyState);
  const fromIdle=replay?Number(getComputedStyle(copyIdle).opacity):1;
  const fromResult=replay?Number(getComputedStyle(copyResult).opacity):0;
  clearCopyFeedback();
  copyButton.dataset.copyState=copied?'success':'failure';
  copyLabel.textContent=copied?'Copied':'Blocked';
  const timing=COPY_TIMING;
  fadeCopyLabel(copyIdle,fromIdle,0,timing.out);
  fadeCopyLabel(copyResult,fromResult,1,timing.in,timing.labelDelay);
  if(copied){
    if(!copyReducedMotion.matches){
      copyTickAnimation=copyTick.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{
        duration:timing.tick,delay:timing.tickDelay,fill:'both',easing:'cubic-bezier(.65,0,.35,1)'
      });
      copyAnimations.push(copyTickAnimation);
    }
    copyTimers.push(setTimeout(playCopyTap,timing.tickDelay));
  }
  copyTimers.push(setTimeout(()=>{
    copyStatus.textContent=copied?'SVG copied':'Couldn’t copy SVG';
  },30));
  copyTimers.push(setTimeout(()=>{
    clearCopyAnimations();
    const easeOut='cubic-bezier(.23,1,.32,1)';
    fadeCopyLabel(copyResult,1,0,timing.returnOut,0,easeOut);
    const incoming=fadeCopyLabel(copyIdle,0,1,timing.returnIn,0,easeOut);
    incoming.onfinish=()=>{
      if(copyAnimations.includes(incoming))clearCopyFeedback();
    };
  },timing.tickDelay+timing.tick+timing.hold));
}
async function copySvg(){
  const icon=by[sel];
  if(copyRequest||!icon)return;
  const request=Symbol();
  copyRequest=request;
  prepareCopyAudio();
  const text=svgOut(icon,$('#sizes')?P.px:24);
  let copied=false;
  try{
    await navigator.clipboard.writeText(text);
    copied=true;
  }catch(_){
    if(copyRequest!==request)return;
    const focused=document.activeElement;
    const buffer=document.createElement('textarea');
    buffer.value=text;
    buffer.readOnly=true;
    buffer.tabIndex=-1;
    buffer.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.append(buffer);
    buffer.select();
    try{copied=document.execCommand('copy')}catch(_){}
    buffer.remove();
    if(focused?.isConnected)focused.focus({preventScroll:true});
  }
  if(copyRequest!==request)return;
  copyRequest=null;
  showCopyFeedback(copied);
}
copyButton.onclick=copySvg;
copyReducedMotion.addEventListener('change',()=>{
  if(copyReducedMotion.matches)copyTickAnimation?.cancel();
});
addEventListener('keydown',e=>{
  if(lensState!=='closed'){
    if(e.key==='Escape'){e.preventDefault();closeInsp();}
    if(e.key==='Tab'){
      const controls=[...sheet.querySelectorAll('button:not([disabled])')].filter(x=>x.getClientRects().length);
      const pos=controls.indexOf(document.activeElement);
      if(controls.length&&(pos<0||(e.shiftKey?pos===0:pos===controls.length-1))){
        e.preventDefault();controls[e.shiftKey?controls.length-1:0].focus();
      }
    }
    return;
  }
  const typing=document.activeElement===q;
  if(!typing&&e.key==='Escape'&&xPin){xPin=null;applyX(xFocus());anatButtons();return;}
  if(!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.repeat&&(e.key==='d'||e.key==='D'))toggleTheme();
  if((e.key==='/'&&!typing)||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')){e.preventDefault();q.focus();q.select();return;}
  if(e.key==='Escape'){if(typing){if(q.value){q.value='';$('#find').classList.remove('has');search()}else q.blur()}return;}
});
